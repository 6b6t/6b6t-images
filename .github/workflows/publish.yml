name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - java/**
      - mysql-client/**
      - .github/workflows/publish.yml
  pull_request:
    branches:
      - main
    paths:
      - java/**
      - mysql-client/**
      - .github/workflows/publish.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - name: java
            context: ./java
          - name: mysql-client
            context: ./mysql-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/6b6t/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build image for tests
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          pull: true
          no-cache: true
          load: true
          tags: 6b6t-${{ matrix.image.name }}:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Java4Shell mitigation
        if: matrix.image.name == 'java'
        run: bash java/test.sh 6b6t-java:test

      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
