name: Build and Publish UNFS3

on:
  push:
    branches: [main]
    paths:
      - unfs3/**
      - .github/workflows/publish-unfs3.yml
  pull_request:
    branches: [main]
    paths:
      - unfs3/**
      - .github/workflows/publish-unfs3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image for integration tests
        uses: docker/build-push-action@v7
        with:
          context: ./unfs3
          load: true
          tags: unfs3:test
          cache-from: type=gha,scope=unfs3
          cache-to: type=gha,scope=unfs3,mode=max
      - name: Test unprivileged NFS file operations
        run: ./unfs3/test.sh unfs3:test
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/6b6t/unfs3
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./unfs3
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=unfs3
